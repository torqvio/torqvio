name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: Install dependencies
        run: |
          cd backend
          pnpm install
          
      - name: Run tests
        run: |
          cd backend
          pnpm test
          
      - name: Lint
        run: |
          cd backend
          pnpm run lint
          
      - name: Build
        run: |
          cd backend
          pnpm run build || true  # Allow build to fail for now, focus on lint

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install
          
      - name: Run tests
        working-directory: ./frontend
        run: pnpm test || true  # Frontend may not have tests
          
      - name: Lint
        working-directory: ./frontend
        run: npx next lint .
          
      - name: Build
        working-directory: ./frontend
        run: pnpm run build

  
