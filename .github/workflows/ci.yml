name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          
      - name: Install dependencies
        run: |
          cd backend
          pnpm install
          
      - name: Run tests
        run: |
          cd backend
          pnpm test || true
          
      - name: Type check
        run: |
          cd backend
          pnpm type-check || true

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          
      - name: Install dependencies
        run: |
          cd frontend
          pnpm install
          
      - name: Run tests
        run: |
          cd frontend
          pnpm test || true
          
      - name: Build
        run: |
          cd frontend
          pnpm build
          
      - name: Type check
        run: |
          cd frontend
          pnpm type-check || true
