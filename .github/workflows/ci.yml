name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger for testing
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
            
      - name: Install dependencies
        run: |
          cd backend
          pnpm install --frozen-lockfile
          
      - name: Run tests
        run: |
          cd backend
          pnpm test --reporter=junit --outputFile=test-results.xml || echo "Tests may not exist yet"
          
      - name: Lint
        run: |
          cd backend
          pnpm run lint
          
      - name: Build
        run: |
          cd backend
          pnpm run build
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-frontend-
            
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
          
      - name: Run tests
        working-directory: ./frontend
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            pnpm test --reporter=junit --outputFile=test-results.xml
          else
            echo "No tests found, skipping"
          fi
          
      - name: Build
        working-directory: ./frontend
        run: pnpm run build
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results.xml

  
