name: Deploy All Services

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        required: false
        default: false
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy all services to production
        run: |
          echo "Deploy all services to production VPS"
          # Function to retry SSH commands
          retry_ssh() {
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "SSH attempt $attempt/$max_attempts"
              if sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "$1"; then
                echo "SSH command succeeded"
                return 0
              else
                echo "SSH attempt $attempt failed, waiting 10 seconds..."
                sleep 10
                ((attempt++))
              fi
            done
            echo "All SSH attempts failed"
            exit 1
          }
          
          # Test connectivity first
          retry_ssh "echo 'SSH connection successful'"
          
          # Pull latest changes and ensure docker-compose.yml exists
          retry_ssh "cd /var/www/torqvio && git pull origin main && git checkout HEAD -- docker-compose.yml"
          
          # Clear Docker cache and rebuild
          retry_ssh "cd /var/www/torqvio && docker system prune -f"
          
          # Deploy all services together using compose file:
          retry_ssh "cd /var/www/torqvio && docker-compose down && docker-compose up -d --build"
          
          # Verify services are running
          retry_ssh "cd /var/www/torqvio && docker ps"
          
  
