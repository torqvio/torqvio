name: Deploy All Services

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        required: false
        default: false
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend'
        required: false
        default: false
        type: boolean

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-automatic:
    needs: detect-changes
    if: github.event_name == 'push' && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          
                
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy all services to production
        run: |
          echo "Deploy all services to production VPS"
          # Check if directory exists and show actual error:
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls -la /var/www/ || echo 'Directory does not exist'"

deploy-manual:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_backend == 'true' || github.event.inputs.deploy_frontend == 'true')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          
                
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy all services to production
        run: |
          echo "Deploy all services to production VPS"
          # Check if directory exists and show actual error:
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls -la /var/www/ || echo 'Directory does not exist'"
          
  
