name: Deploy All Services

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        required: false
        default: false
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy all services to production
        run: |
          echo "Deploy all services to production VPS"
          # Test connectivity first
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"
          # Check what files exist and restore docker-compose.yml if needed
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/torqvio && ls -la docker-compose.yml || cp docker/docker-compose.yml docker-compose.yml"
          # Pull latest changes
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/torqvio && git pull origin main && docker system prune -f"
          # Deploy all services together using compose file:
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/torqvio && docker-compose down && docker-compose up -d --build"
          
  
