name: Deploy All Services

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        required: false
        default: false
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend'
        required: false
        default: false
        type: boolean

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true') || (github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Run tests
        run: |
          cd backend
          npm test
          
      - name: Lint
        run: |
          cd backend
          npm run lint
          
      - name: Format check
        run: |
          cd backend
          npm run format -- --check
          
      - name: Build
        run: |
          cd backend
          npm run build || true
          
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy to production
        run: |
          echo "Deploy backend to production VPS"
          # Automated deployment via Docker with password authentication:
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/torqvio && git pull origin main && cd backend && docker-compose down && docker-compose up -d --build"
          
  deploy-frontend:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true') || (github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd frontend
          npm install
          
      - name: Run tests
        run: |
          cd frontend
          npm test || true
          
                
      - name: Build
        run: |
          cd frontend
          npm run build
          
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy to production
        run: |
          echo "Deploy frontend to production VPS"
          # Automated deployment via Docker with password authentication:
          sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/torqvio && git pull origin main && cd frontend && docker-compose down && docker-compose up -d --build"
          
  
