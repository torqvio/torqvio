name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Run tests
        run: |
          cd backend
          npm test
          
      - name: Lint
        run: |
          cd backend
          npm run lint
          
      - name: Build
        run: |
          cd backend
          npm run build
          
      - name: Format check
        run: |
          cd backend
          npm run format -- --check
          
      - name: Deploy to production
        run: |
          echo "Deploy backend to production VPS"
          # Automated deployment via Docker with secrets:
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/torqvio && git pull origin main && cd backend && docker-compose down && docker-compose up -d --build"
          
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Build
        run: |
          cd backend
          npm run build
          
      - name: Deploy to staging
        run: |
          echo "Deploy backend to staging"
          # Staging deployment logic
