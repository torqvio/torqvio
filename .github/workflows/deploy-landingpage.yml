name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths: ['landinpage/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: landinpage/package-lock.json
          
      - name: Install dependencies
        run: |
          cd landinpage
          npm ci
          
      - name: Run tests
        run: |
          cd landinpage
          npm test || true
          
      - name: Build
        run: |
          cd landinpage
          npm run build
          
      - name: Deploy to production
        run: |
          echo "Deploy landing page to production"
          # Add your deployment logic here
          # Example for Vercel:
          # npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
          # Example for Netlify:
          # npx netlify deploy --prod --dir=.next --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }}
