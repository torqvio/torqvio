name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths: ['landinpage/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd landinpage
          npm install
          
      - name: Run tests
        run: |
          cd landinpage
          npm test || true  # Landing page may not have tests
          
      - name: Lint
        run: |
          cd landinpage
          npm run lint || true  # May not have lint script
          
      - name: Build
        run: |
          cd landinpage
          npm run build
          
      - name: Export static files
        run: |
          cd landinpage
          npm run export || true  # If using Next.js static export
          
      - name: Deploy to production
        run: |
          echo "Deploy landing page to production VPS"
          # Use the automated deployment script:
          ssh root@72.61.89.88 "cd /var/www/torqvio && git pull origin main && docker-compose down && docker-compose up -d --build"
          
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd landinpage
          npm install
          
      - name: Build
        run: |
          cd landinpage
          npm run build
          
      - name: Deploy to staging
        run: |
          echo "Deploy landing page to staging"
          # Staging deployment logic
