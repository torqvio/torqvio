version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: torqvio
      POSTGRES_USER: torqvio
      POSTGRES_PASSWORD: torqvio123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torqvio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8459:8459"
    environment:
      DATABASE_URL: postgresql://torqvio:torqvio123@postgres:5432/torqvio
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: your-jwt-secret-key
      API_KEY_SECRET: your-api-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7243:7243"
    environment:
      NEXT_PUBLIC_API_URL: https://api.torqvio.com
      PORT: 7243
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
