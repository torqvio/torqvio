<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Torqvio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0F14;
            color: #FFFFFF;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 32px;
            background-color: #0B0F14;
            border: 1px solid #2A3142;
            border-radius: 12px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: #6C5CE7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .logo-text {
            min-width: 0;
        }
        
        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1;
            margin: 0;
            letter-spacing: -0.03em;
        }
        
        .logo-text p {
            font-size: 10px;
            color: #8891A8;
            line-height: 1;
            margin: 4px 0 0;
        }
        
        .content {
            margin-bottom: 32px;
        }
        
        .content h2 {
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        
        .content p {
            font-size: 15px;
            color: #8891A8;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .button {
            display: inline-block;
            background-color: #6C5CE7;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        
        .button:hover {
            opacity: 0.9;
        }
        
        .divider {
            border: none;
            border-top: 1px solid #2A3142;
            margin: 32px 0;
        }
        
        .footer {
            font-size: 12px;
            color: #8891A8;
            line-height: 1.4;
        }
        
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 24px;
            }
            
            .content h2 {
                font-size: 20px;
            }
            
            .button {
                display: block;
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="10" fill="#6C5CE7"/>
                    <path d="M9 13 L20 13 L28 13 L31 20" stroke="white" strokeWidth="3" strokeLinecap="round" fill="none" opacity="0.45"/>
                    <path d="M9 20 L24 20 L31 20" stroke="white" strokeWidth="3" strokeLinecap="round" fill="none"/>
                    <path d="M9 27 L20 27 L28 27 L31 20" stroke="white" strokeWidth="3" strokeLinecap="round" fill="none" opacity="0.45"/>
                    <path d="M28 17 L32 20 L28 23" stroke="white" strokeWidth="3" strokeLinecap="round" fill="none"/>
                </svg>
            </div>
            <div class="logo-text">
                <h1>Torqvio</h1>
                <p>Durable Execution Engine</p>
            </div>
        </div>
        
        <div class="content">
            <h2>Welcome, {{name}}!</h2>
            <p>
                Your account is ready. Head to your dashboard to create your first workflow — your background jobs will never fail silently again.
            </p>
            <a href="{{dashboardUrl}}" class="button">Go to dashboard</a>
        </div>
        
        <hr class="divider">
        
        <p class="footer">Torqvio · Durable execution for reliable workflows</p>
    </div>
</body>
</html>
