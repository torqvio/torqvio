<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple background -->
  <rect width="40" height="40" rx="8" fill="#6C5CE7"/>
  
  <!-- Simple flow lines - straight lines only -->
  <line x1="8" y1="15" x2="20" y2="15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="15" x2="28" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <line x1="8" y1="20" x2="26" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <line x1="8" y1="25" x2="20" y2="25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="25" x2="28" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Arrow -->
  <line x1="26" y1="17" x2="30" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="23" x2="30" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
