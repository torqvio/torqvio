<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="10" fill="#6C5CE7" />

  <!-- Flow mark: three horizontal streams curving right — white on primary -->
  <!-- Top stream -->
  <path
    d="M9 13 L20 13 Q28 13 31 20"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.45"
  />
  <!-- Middle stream — the hero line -->
  <path
    d="M9 20 L24 20 Q31 20 31 20"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Bottom stream -->
  <path
    d="M9 27 L20 27 Q28 27 31 20"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.45"
  />

  <!-- Arrow head on the right -->
  <path
    d="M28 17 L32 20 L28 23"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
